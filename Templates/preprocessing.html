<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Preprocessing - Student Performance Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.8.1/font/bootstrap-icons.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body { background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%); min-height: 100vh; display: flex; }

        .sidebar { width: 280px; height: 100vh; background: linear-gradient(180deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%); padding: 30px 20px; position: fixed; left: 0; top: 0; overflow-y: auto; box-shadow: 4px 0 20px rgba(0,0,0,0.3); z-index: 1000; }
        .sidebar::-webkit-scrollbar { width: 5px; }
        .sidebar::-webkit-scrollbar-track { background: rgba(255,255,255,0.1); }
        .sidebar::-webkit-scrollbar-thumb { background: linear-gradient(180deg, #f7971e, #ffd200); border-radius: 10px; }
        .sidebar-brand { text-align: center; padding: 20px 0 30px 0; border-bottom: 2px solid rgba(255,255,255,0.1); margin-bottom: 30px; }
        .sidebar-brand h2 { color: #fff; font-weight: 800; font-size: 1.5rem; }
        .sidebar-brand h2 i { color: #f7971e; margin-right: 10px; }
        .sidebar-brand p { color: rgba(255,255,255,0.6); font-size: 0.8rem; margin-top: 5px; }
        .sidebar-nav { list-style: none; padding: 0; }
        .sidebar-nav li { margin-bottom: 8px; }
        .sidebar-nav li a { display: flex; align-items: center; padding: 14px 20px; color: rgba(255,255,255,0.7); text-decoration: none; border-radius: 12px; transition: all 0.3s ease; font-weight: 500; font-size: 0.95rem; }
        .sidebar-nav li a i { margin-right: 15px; font-size: 1.2rem; width: 25px; text-align: center; }
        .sidebar-nav li a:hover { background: rgba(255,255,255,0.1); color: #fff; transform: translateX(5px); }
        .sidebar-nav li a.active { background: linear-gradient(135deg, #f7971e, #ffd200); color: #1a1a2e; font-weight: 600; box-shadow: 0 4px 15px rgba(247,151,30,0.4); }
        .sidebar-nav li a .badge { margin-left: auto; background: linear-gradient(135deg, #f7971e, #ffd200); color: #1a1a2e; font-weight: 600; padding: 4px 10px; border-radius: 20px; font-size: 0.7rem; }

        .main-content { margin-left: 280px; padding: 40px; width: calc(100% - 280px); min-height: 100vh; }
        .page-header { background: rgba(255,255,255,0.9); backdrop-filter: blur(10px); padding: 30px; border-radius: 20px; box-shadow: 0 10px 40px rgba(0,0,0,0.08); margin-bottom: 30px; border: 1px solid rgba(255,255,255,0.2); }
        .page-header h1 { font-weight: 800; color: #1a1a2e; font-size: 2rem; }
        .page-header h1 i { color: #f7971e; margin-right: 15px; }
        .page-header p { color: #6c757d; margin-top: 5px; }

        .card { border: none; border-radius: 15px; box-shadow: 0 10px 40px rgba(0,0,0,0.08); background: rgba(255,255,255,0.95); backdrop-filter: blur(10px); margin-bottom: 20px; }
        .card-header { background: linear-gradient(135deg, #1a1a2e, #16213e); color: white; border-radius: 15px 15px 0 0 !important; border: none; padding: 20px; font-weight: 600; }
        .card-header i { color: #f7971e; margin-right: 10px; }

        .btn-primary { background: linear-gradient(135deg, #f7971e, #ffd200); border: none; color: #1a1a2e; font-weight: 600; padding: 12px 30px; border-radius: 10px; transition: all 0.3s ease; }
        .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 8px 25px rgba(247,151,30,0.4); color: #1a1a2e; }
        .btn-success { background: linear-gradient(135deg, #43e97b, #38f9d7); border: none; color: #1a1a2e; font-weight: 600; padding: 12px 30px; border-radius: 10px; transition: all 0.3s ease; }
        .btn-success:hover { transform: translateY(-2px); box-shadow: 0 8px 25px rgba(67,233,123,0.4); color: #1a1a2e; }

        .list-group-item { cursor: pointer; border: none; border-radius: 10px !important; margin-bottom: 8px; padding: 15px 20px; transition: all 0.3s ease; }
        .list-group-item:hover { background: rgba(247,151,30,0.1); transform: translateX(5px); }
        .list-group-item.active { background: linear-gradient(135deg, #f7971e, #ffd200); color: #1a1a2e; font-weight: 600; border: none; }
        .list-group-item i { margin-right: 10px; }

        .preprocessing-result { padding: 20px; border-radius: 10px; background: #f8f9fa; margin-top: 20px; }
        .preprocessing-result h6 { color: #1a1a2e; font-weight: 600; }

        @media (max-width: 992px) {
            .sidebar { width: 80px; padding: 20px 10px; }
            .sidebar-brand h2 { font-size: 0; }
            .sidebar-brand h2 i { font-size: 1.5rem; margin-right: 0; }
            .sidebar-brand p { display: none; }
            .sidebar-nav li a { justify-content: center; padding: 14px; font-size: 0; }
            .sidebar-nav li a i { font-size: 1.5rem; margin-right: 0; }
            .sidebar-nav li a .badge { display: none; }
            .sidebar-nav li a span { display: none; }
            .main-content { margin-left: 80px; width: calc(100% - 80px); padding: 20px; }
        }
    </style>
</head>
<body>
    <!-- Vertical Sidebar -->
    <div class="sidebar">
        <div class="sidebar-brand">
            <h2><i class="bi bi-graph-up"></i> Dashboard</h2>
            <p>Student Performance</p>
        </div>
        <ul class="sidebar-nav">
            <li><a href="/"><i class="bi bi-house"></i> <span>Dashboard</span></a></li>
            <li><a href="/dataset_loading"><i class="bi bi-upload"></i> <span>Dataset Loading</span></a></li>
            <li><a href="/preprocessing" class="active"><i class="bi bi-gear"></i> <span>Preprocessing</span> <span class="badge">5</span></a></li>
            <li><a href="/predict"><i class="bi bi-robot"></i> <span>Predict</span></a></li>
            <li><a href="/students"><i class="bi bi-people"></i> <span>Students</span> <span class="badge">12</span></a></li>
            <li><a href="/analytics"><i class="bi bi-bar-chart"></i> <span>Analytics</span></a></li>
            <li><a href="/about"><i class="bi bi-info-circle"></i> <span>About</span></a></li>
            <li><a href="/help"><i class="bi bi-question-circle"></i> <span>Help</span></a></li>
        </ul>
    </div>

    <!-- Main Content -->
    <div class="main-content">
        <div class="page-header">
            <h1><i class="bi bi-gear"></i> Data Preprocessing</h1>
            <p>Clean and prepare your data for analysis and modeling</p>
        </div>

        <div class="row">
            <div class="col-md-4">
                <div class="card">
                    <div class="card-header">
                        <i class="bi bi-tools"></i> Preprocessing Options
                    </div>
                    <div class="card-body">
                        <div class="list-group" id="preprocessingOptions">
                            <button class="list-group-item list-group-item-action active" data-action="missing_values">
                                <i class="bi bi-exclamation-triangle"></i> Missing Values Handling
                            </button>
                            <button class="list-group-item list-group-item-action" data-action="encoding">
                                <i class="bi bi-tag"></i> Encoding
                            </button>
                            <button class="list-group-item list-group-item-action" data-action="feature_scaling">
                                <i class="bi bi-rulers"></i> Feature Scaling
                            </button>
                            <button class="list-group-item list-group-item-action" data-action="outlier_detection">
                                <i class="bi bi-graph-up-arrow"></i> Outlier Detection
                            </button>
                            <button class="list-group-item list-group-item-action" data-action="remove_duplicates">
                                <i class="bi bi-files"></i> Remove Duplicates
                            </button>
                        </div>
                    </div>
                </div>
            </div>

            <div class="col-md-8">
                <div class="card">
                    <div class="card-header">
                        <i class="bi bi-play-circle"></i> <span id="operationTitle">Missing Values Handling</span>
                    </div>
                    <div class="card-body">
                        <div id="preprocessingForm">
                            <!-- Form will be dynamically loaded -->
                        </div>
                        <div id="preprocessingResult" class="preprocessing-result" style="display: none;">
                            <h6><i class="bi bi-check-circle" style="color: #43e97b;"></i> Result</h6>
                            <div id="resultContent"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script>
        $(document).ready(function() {
            // Initialize with missing values form
            loadMissingValuesForm();

            // Handle option clicks
            $('.list-group-item').click(function() {
                $('.list-group-item').removeClass('active');
                $(this).addClass('active');

                var action = $(this).data('action');
                $('#operationTitle').text($(this).text().trim());

                switch(action) {
                    case 'missing_values':
                        loadMissingValuesForm();
                        break;
                    case 'encoding':
                        loadEncodingForm();
                        break;
                    case 'feature_scaling':
                        loadFeatureScalingForm();
                        break;
                    case 'outlier_detection':
                        loadOutlierDetectionForm();
                        break;
                    case 'remove_duplicates':
                        loadRemoveDuplicatesForm();
                        break;
                }

                $('#preprocessingResult').hide();
            });

            function loadMissingValuesForm() {
                $('#preprocessingForm').html(`
                    <form id="missingValuesForm">
                        <div class="mb-3">
                            <label class="form-label fw-bold">Select Column (Optional)</label>
                            <select class="form-select" name="column">
                                <option value="">All numeric columns</option>
                                <option value="age">Age</option>
                                <option value="grade">Grade</option>
                                <option value="score">Score</option>
                                <option value="attendance">Attendance</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-bold">Method</label>
                            <select class="form-select" name="method">
                                <option value="drop">Drop rows with missing values</option>
                                <option value="mean">Fill with Mean</option>
                                <option value="median">Fill with Median</option>
                                <option value="mode">Fill with Mode</option>
                            </select>
                        </div>
                        <button type="submit" class="btn btn-primary"><i class="bi bi-check2"></i> Apply</button>
                    </form>
                `);

                $('#missingValuesForm').submit(function(e) {
                    e.preventDefault();
                    var formData = $(this).serializeArray();
                    var data = { action: 'missing_values' };
                    formData.forEach(function(item) {
                        data[item.name] = item.value;
                    });

                    $.ajax({
                        url: '/preprocess',
                        type: 'POST',
                        contentType: 'application/json',
                        data: JSON.stringify(data),
                        success: function(response) {
                            $('#preprocessingResult').show();
                            if (response.success) {
                                $('#resultContent').html(`
                                    <div class="alert alert-success">
                                        <i class="bi bi-check-circle"></i> ${response.message}
                                        ${response.null_counts ? '<br><br><pre>' + JSON.stringify(response.null_counts, null, 2) + '</pre>' : ''}
                                        ${response.rows_removed !== undefined ? '<br>Rows removed: ' + response.rows_removed : ''}
                                    </div>
                                `);
                            } else {
                                $('#resultContent').html(`<div class="alert alert-danger">${response.error}</div>`);
                            }
                        },
                        error: function(xhr) {
                            $('#preprocessingResult').show();
                            $('#resultContent').html(`<div class="alert alert-danger">Error: ${xhr.responseJSON?.error || 'Something went wrong'}</div>`);
                        }
                    });
                });
            }

            function loadEncodingForm() {
                $('#preprocessingForm').html(`
                    <form id="encodingForm">
                        <div class="mb-3">
                            <label class="form-label fw-bold">Select Column to Encode</label>
                            <select class="form-select" name="column">
                                <option value="gender">Gender</option>
                                <option value="department">Department</option>
                                <option value="grade">Grade</option>
                            </select>
                        </div>
                        <button type="submit" class="btn btn-primary"><i class="bi bi-check2"></i> Apply Encoding</button>
                    </form>
                `);

                $('#encodingForm').submit(function(e) {
                    e.preventDefault();
                    var column = $('select[name="column"]').val();

                    $.ajax({
                        url: '/preprocess',
                        type: 'POST',
                        contentType: 'application/json',
                        data: JSON.stringify({ action: 'encoding', column: column }),
                        success: function(response) {
                            $('#preprocessingResult').show();
                            if (response.success) {
                                $('#resultContent').html(`<div class="alert alert-success"><i class="bi bi-check-circle"></i> ${response.message}</div>`);
                            } else {
                                $('#resultContent').html(`<div class="alert alert-danger">${response.error}</div>`);
                            }
                        },
                        error: function(xhr) {
                            $('#preprocessingResult').show();
                            $('#resultContent').html(`<div class="alert alert-danger">Error: ${xhr.responseJSON?.error || 'Something went wrong'}</div>`);
                        }
                    });
                });
            }

            function loadFeatureScalingForm() {
                $('#preprocessingForm').html(`
                    <form id="scalingForm">
                        <div class="mb-3">
                            <label class="form-label fw-bold">Scaling Method</label>
                            <select class="form-select" name="method">
                                <option value="standard">Standard Scaling (Z-score)</option>
                                <option value="minmax">Min-Max Scaling (Normalization)</option>
                            </select>
                        </div>
                        <button type="submit" class="btn btn-primary"><i class="bi bi-check2"></i> Apply Scaling</button>
                    </form>
                `);

                $('#scalingForm').submit(function(e) {
                    e.preventDefault();
                    var method = $('select[name="method"]').val();

                    $.ajax({
                        url: '/preprocess',
                        type: 'POST',
                        contentType: 'application/json',
                        data: JSON.stringify({ action: 'feature_scaling', method: method }),
                        success: function(response) {
                            $('#preprocessingResult').show();
                            if (response.success) {
                                $('#resultContent').html(`
                                    <div class="alert alert-success">
                                        <i class="bi bi-check-circle"></i> ${response.message}
                                        <br>Scaled columns: ${response.scaled_columns?.join(', ') || 'All numeric columns'}
                                    </div>
                                `);
                            } else {
                                $('#resultContent').html(`<div class="alert alert-danger">${response.error}</div>`);
                            }
                        },
                        error: function(xhr) {
                            $('#preprocessingResult').show();
                            $('#resultContent').html(`<div class="alert alert-danger">Error: ${xhr.responseJSON?.error || 'Something went wrong'}</div>`);
                        }
                    });
                });
            }

            function loadOutlierDetectionForm() {
                $('#preprocessingForm').html(`
                    <form id="outlierForm">
                        <div class="mb-3">
                            <label class="form-label fw-bold">Select Column</label>
                            <select class="form-select" name="column">
                                <option value="age">Age</option>
                                <option value="grade">Grade</option>
                                <option value="score">Score</option>
                                <option value="attendance">Attendance</option>
                            </select>
                        </div>
                        <button type="submit" class="btn btn-primary"><i class="bi bi-check2"></i> Detect Outliers</button>
                    </form>
                `);

                $('#outlierForm').submit(function(e) {
                    e.preventDefault();
                    var column = $('select[name="column"]').val();

                    $.ajax({
                        url: '/preprocess',
                        type: 'POST',
                        contentType: 'application/json',
                        data: JSON.stringify({ action: 'outlier_detection', column: column }),
                        success: function(response) {
                            $('#preprocessingResult').show();
                            if (response.success) {
                                $('#resultContent').html(`
                                    <div class="alert alert-warning">
                                        <i class="bi bi-exclamation-triangle"></i> ${response.message}
                                        <br><strong>Outliers found:</strong> ${response.outliers_count || 0}
                                    </div>
                                `);
                            } else {
                                $('#resultContent').html(`<div class="alert alert-danger">${response.error}</div>`);
                            }
                        },
                        error: function(xhr) {
                            $('#preprocessingResult').show();
                            $('#resultContent').html(`<div class="alert alert-danger">Error: ${xhr.responseJSON?.error || 'Something went wrong'}</div>`);
                        }
                    });
                });
            }

            function loadRemoveDuplicatesForm() {
                $('#preprocessingForm').html(`
                    <form id="duplicatesForm">
                        <div class="alert alert-info">
                            <i class="bi bi-info-circle"></i> This will remove all duplicate rows from your dataset.
                        </div>
                        <button type="submit" class="btn btn-primary"><i class="bi bi-check2"></i> Remove Duplicates</button>
                    </form>
                `);

                $('#duplicatesForm').submit(function(e) {
                    e.preventDefault();

                    $.ajax({
                        url: '/preprocess',
                        type: 'POST',
                        contentType: 'application/json',
                        data: JSON.stringify({ action: 'remove_duplicates' }),
                        success: function(response) {
                            $('#preprocessingResult').show();
                            if (response.success) {
                                $('#resultContent').html(`
                                    <div class="alert alert-success">
                                        <i class="bi bi-check-circle"></i> ${response.message}
                                        <br>Rows removed: ${response.rows_removed || 0}
                                        <br>Remaining rows: ${response.remaining_rows || 0}
                                    </div>
                                `);
                            } else {
                                $('#resultContent').html(`<div class="alert alert-danger">${response.error}</div>`);
                            }
                        },
                        error: function(xhr) {
                            $('#preprocessingResult').show();
                            $('#resultContent').html(`<div class="alert alert-danger">Error: ${xhr.responseJSON?.error || 'Something went wrong'}</div>`);
                        }
                    });
                });
            }
        });
    </script>
</body>
</html>
