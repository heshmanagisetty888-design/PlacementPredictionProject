<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Students List</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.8.1/font/bootstrap-icons.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body { background: #f0f2f5; display: flex; }
        .sidebar { width: 280px; height: 100vh; background: linear-gradient(180deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%); padding: 30px 20px; position: fixed; left: 0; top: 0; overflow-y: auto; z-index: 1000; }
        .sidebar::-webkit-scrollbar { width: 5px; }
        .sidebar::-webkit-scrollbar-track { background: rgba(255,255,255,0.1); }
        .sidebar::-webkit-scrollbar-thumb { background: linear-gradient(180deg, #f7971e, #ffd200); border-radius: 10px; }
        .sidebar-brand { text-align: center; padding: 20px 0 30px 0; border-bottom: 2px solid rgba(255,255,255,0.1); margin-bottom: 30px; }
        .sidebar-brand h2 { color: #fff; font-weight: 800; font-size: 1.5rem; }
        .sidebar-brand h2 i { color: #f7971e; margin-right: 10px; }
        .sidebar-nav { list-style: none; padding: 0; }
        .sidebar-nav li { margin-bottom: 8px; }
        .sidebar-nav li a { display: flex; align-items: center; padding: 14px 20px; color: rgba(255,255,255,0.7); text-decoration: none; border-radius: 12px; transition: all 0.3s ease; font-weight: 500; font-size: 0.95rem; }
        .sidebar-nav li a i { margin-right: 15px; font-size: 1.2rem; width: 25px; text-align: center; }
        .sidebar-nav li a:hover { background: rgba(255,255,255,0.1); color: #fff; transform: translateX(5px); }
        .sidebar-nav li a.active { background: linear-gradient(135deg, #f7971e, #ffd200); color: #1a1a2e; font-weight: 600; box-shadow: 0 4px 15px rgba(247,151,30,0.4); }
        .main-content { margin-left: 280px; padding: 40px; width: calc(100% - 280px); min-height: 100vh; }
        .header-card { background: white; padding: 30px; border-radius: 20px; box-shadow: 0 5px 20px rgba(0,0,0,0.05); margin-bottom: 30px; }
        .header-card h1 { font-weight: 800; color: #1a1a2e; font-size: 2rem; }
        .header-card h1 i { color: #f7971e; margin-right: 15px; }
        .table-container { background: white; padding: 20px; border-radius: 15px; box-shadow: 0 5px 20px rgba(0,0,0,0.05); }
        .table-responsive { max-height: 600px; overflow-y: auto; }
        .table thead th { position: sticky; top: 0; background-color: #f8f9fa; z-index: 10; }
    </style>
</head>
<body>
    <div class="sidebar">
        <div class="sidebar-brand">
            <h2><i class="bi bi-graph-up"></i> Dashboard</h2>
            <p>Student Performance</p>
        </div>
        <ul class="sidebar-nav">
            <li><a href="/"><i class="bi bi-house"></i> <span>Dashboard</span></a></li>
            <li><a href="/dataset_loading"><i class="bi bi-upload"></i> <span>Dataset Loading</span></a></li>
            <li><a href="/preprocessing"><i class="bi bi-gear"></i> <span>Preprocessing</span></a></li>
            <li><a href="/predict"><i class="bi bi-robot"></i> <span>Predict</span></a></li>
            <li><a href="/students" class="active"><i class="bi bi-people"></i> <span>Students</span></a></li>
            <li><a href="/eda_info"><i class="bi bi-info-square"></i> <span>EDA Info</span></a></li>
            <li><a href="/analytics"><i class="bi bi-bar-chart"></i> <span>Analytics</span></a></li>
        </ul>
    </div>

    <div class="main-content">
        <div class="header-card">
            <h1><i class="bi bi-people-fill"></i> Student Records</h1>
            <p class="text-muted">View the loaded student dataset. <span id="recordCount"></span></p>
        </div>

        <div class="table-container">
            <div class="table-responsive">
                <table class="table table-hover table-striped mb-0" id="studentsTable">
                    <thead>
                        <tr id="tableHeaders">
                            <th>Loading Data...</th>
                        </tr>
                    </thead>
                    <tbody id="tableBody">
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() { loadStudents(); });

        function loadStudents() {
            document.getElementById('tableHeaders').innerHTML = `<th>Loading Data...</th>`;
            document.getElementById('tableBody').innerHTML = '';

            fetch('/get_students_data')
            .then(res => res.json())
            .then(data => {
                if(data.success) {
                    document.getElementById('recordCount').innerText = `(Displaying ${data.data.length} rows)`;
                    buildTable(data.columns, data.data);
                } else {
                    document.getElementById('tableHeaders').innerHTML = `<th colspan="10" class="text-center text-danger">${data.message}</th>`;
                }
            })
            .catch(err => {
                document.getElementById('tableHeaders').innerHTML = `<th colspan="10" class="text-center text-danger">Upload a dataset first to view students.</th>`;
            });
        }

        function buildTable(columns, rows) {
            const thead = document.getElementById('tableHeaders');
            thead.innerHTML = '';
            columns.forEach(col => {
                const th = document.createElement('th');
                th.innerText = col;
                thead.appendChild(th);
            });

            const tbody = document.getElementById('tableBody');
            tbody.innerHTML = '';
            rows.forEach(row => {
                const tr = document.createElement('tr');
                columns.forEach(col => {
                    const td = document.createElement('td');
                    td.innerText = row[col] !== null ? row[col] : '-';
                    tr.appendChild(td);
                });
                tbody.appendChild(tr);
            });
        }
    </script>
</body>
</html>
